[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dsni"
version = "1.0.0"
description = "DSNI: 16S rRNA sequences paired with bacterial cultivation conditions, with genus-disjoint splits and baselines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Juntang Wang" },
    { name = "Hao Wu" },
    { name = "Sheng'en Li" },
    { name = "Yihan Wang" },
    { name = "Dongmian Zou" },
    { name = "Shixin Xu" },
]
keywords = ["16S rRNA", "bacterial cultivation", "dataset", "benchmark", "multi-task learning"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",                       # parquet with list and dictionary columns
    "scikit-learn>=1.3",
    "torch>=2.1",
    "lightning>=2.2",
    "jsonargparse[signatures]>=4.27.7",  # LightningCLI needs it; lightning does not pull it in
    "tabulate>=0.9",                     # pandas.DataFrame.to_markdown for leaderboard.md
]

[project.optional-dependencies]
demo = ["matplotlib>=3.7", "jupyter"]
build = ["requests>=2.31", "biopython>=1.83"]  # only scripts/build_dsni.py uses these

[project.urls]
Repository = "https://github.com/Q9gJYx/AI4DSNI"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "jupyter",
    "nbconvert",
    "ipykernel",
    "matplotlib>=3.7",
    "requests>=2.31",
    "biopython>=1.83",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dsni"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "RUF", "SIM", "C4", "NPY", "PTH"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"scripts/*" = ["D103"]
"notebooks/*.ipynb" = ["D", "E501", "E702", "E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
